<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Jugar y Pasar (3 Jugadores)</title>
    <link rel="icon" type="image/jpeg" href="../../Synkro.jpg">
    <link rel="stylesheet" href="css/salajugarypasar2.css">
</head>
<body>

    <header class="hub-real-header">
        
        <div id="fila-perfil" class="header-real-row clickable-row">
            <img id="user-avatar" src="../../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row">
            <div class="meta-inline-item">
                <img src="../../NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label">Suscripción:</span>
                <span id="subs-display-value" class="subs-value">Ninguna</span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default">Cerrar sesión</button>
            <button type="button" id="btn_volver" class="btn-default">Volver</button>
        </div>

    </header>

    <main class="main-content-hub">
        <div class="brand-language-row" style="justify-content: center;">
            <h1 class="brand-title" id="titulo-juego">Jugar y Pasar - 15 Parejas (3 Jugadores)</h1>
        </div>

        <div class="game-container">
            <div id="info-turno" class="info-turno-text">Turno del Jugador: Preparando...</div>
            <div id="tablero-parejas" class="grid-parejas">
                <!-- Las cartas se generan dinámicamente desde JS -->
            </div>
            <div id="resultado-partida" class="resultado-container" style="display: none;">
                <h2 id="texto-ganador">¡Partida Finalizada!</h2>
                <button type="button" id="btn-reiniciar" class="btn-juego-custom">Jugar de nuevo</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/salajugarypasar2.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Jugar y Pasar</title>
    <link rel="icon" type="image/jpeg" href="../../Synkro.jpg">
    <link rel="stylesheet" href="css/salapasar.css">
</head>
<body>

    <header class="hub-real-header">
        
        <div id="fila-perfil" class="header-real-row clickable-row">
            <img id="user-avatar" src="../../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row">
            <div class="meta-inline-item">
                <img src="../../NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label"></span>
                <span id="subs-display-value" class="subs-value"></span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default"></button>
            <button type="button" id="btn_volver" class="btn-default"></button>
        </div>

    </header>

    <main class="main-content-hub">
        <div class="brand-language-row" style="justify-content: center;">
            <h1 class="brand-title" id="titulo-salapasar">Jugar y Pasar</h1>
        </div>

        <div class="game-container">
            <div class="score-board">
                <span id="text-jugador1">Jugador 1: <strong id="score-j1">0</strong></span>
                <span id="text-jugador2">Jugador 2: <strong id="score-j2">0</strong></span>
            </div>

            <div id="turno-indicator" class="game-result-text">Turno del Jugador 1: Elige tu opción</div>

            <div id="panel-eleccion" class="game-display" style="display: flex;">
                <div class="choice-box" style="width: 100%; align-items: center;">
                    <span class="choice-label" id="label-haz-eleccion">Haz tu elección en secreto</span>
                </div>
            </div>

            <div id="panel-espera-pasar" class="game-result-text" style="display: none; flex-direction: column; gap: 15px;">
                <span id="text-pasale-dispositivo">¡Elección guardada! Pásale el dispositivo al Jugador 2.</span>
                <button type="button" id="btn-listo-j2" class="btn-default" style="background: linear-gradient(135deg, #00aeff, #00eeff); color: #000000; padding: 12px; width: 100%;">Listo, soy el Jugador 2</button>
            </div>

            <div id="panel-resultado-ronda" class="game-result-text" style="display: none; flex-direction: column; gap: 10px;">
                <div style="display: flex; justify-content: space-around; width: 100%;">
                    <span>J1: <strong id="res-j1">❓</strong></span>
                    <span>VS</span>
                    <span>J2: <strong id="res-j2">❓</strong></span>
                </div>
                <div id="texto-ganador-ronda" style="font-weight: bold; font-size: 1.1rem; margin-top: 5px;"></div>
                <button type="button" id="btn-siguiente-ronda" class="btn-default" style="background: linear-gradient(135deg, #00aeff, #00eeff); color: #000000; padding: 10px; width: 100%; margin-top: 10px;">Siguiente Ronda</button>
            </div>

            <div class="sections-grid">
                <button type="button" id="btn-piedra" class="btn-juego-custom"></button>
                <button type="button" id="btn-papel" class="btn-juego-custom"></button>
                <button type="button" id="btn-tijera" class="btn-juego-custom"></button>
            </div>
        </div>
    </main>

    <script type="module" src="js/salapasar.js"></script>
</body>
</html>

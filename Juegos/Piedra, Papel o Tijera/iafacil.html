<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Piedra, Papel o Tijera (IA Fácil)</title>
    <link rel="icon" type="image/jpeg" href="../../Synkro.jpg">
    <link rel="stylesheet" href="css/iafacil.css">
</head>
<body>

    <header class="hub-real-header">
        
        <div id="fila-perfil" class="header-real-row clickable-row">
            <img id="user-avatar" src="../../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row">
            <div class="meta-inline-item">
                <img src="../../NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label"></span>
                <span id="subs-display-value" class="subs-value"></span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default"></button>
            <button type="button" id="btn_volver" class="btn-default"></button>
        </div>

    </header>

    <main class="main-content-hub">
        <div class="brand-language-row" style="justify-content: center;">
            <h1 class="brand-title" id="titulo-iafacil">Piedra, Papel o Tijera - Fácil</h1>
        </div>

        <div class="game-container">
            <div class="score-board">
                <span id="text-jugador">Tú: <strong id="score-usuario">0</strong></span>
                <span id="text-ia">IA: <strong id="score-ia">0</strong></span>
            </div>

            <div class="game-display">
                <div class="choice-box">
                    <span class="choice-label" id="label-tu-eleccion">Tu elección</span>
                    <div id="display-tu-eleccion" class="choice-icon-placeholder">❓</div>
                </div>
                <div class="vs-text">VS</div>
                <div class="choice-box">
                    <span class="choice-label" id="label-ia-eleccion">Elección IA</span>
                    <div id="display-ia-eleccion" class="choice-icon-placeholder">❓</div>
                </div>
            </div>

            <div id="resultado-partida" class="game-result-text">Elige una opción para comenzar</div>

            <div class="sections-grid">
                <button type="button" id="btn-piedra" class="btn-juego-custom"></button>
                <button type="button" id="btn-papel" class="btn-juego-custom"></button>
                <button type="button" id="btn-tijera" class="btn-juego-custom"></button>
            </div>
        </div>
    </main>

    <script type="module" src="js/iafacil.js"></script>
</body>
</html>

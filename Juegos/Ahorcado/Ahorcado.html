<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Ahorcado</title>
    <link rel="icon" type="image/jpeg" href="../../Synkro.jpg">
    <link rel="stylesheet" href="Ahorcado.css">
</head>
<body>

    <header class="hub-real-header">
        
        <div id="fila-perfil" class="header-real-row clickable-row">
            <img id="user-avatar" src="../../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row">
            <div class="meta-inline-item">
                <img src="../../NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label"></span>
                <span id="subs-display-value" class="subs-value"></span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default"></button>
            <button type="button" id="btn_volver" class="btn-default"></button>
        </div>

    </header>

    <main class="main-content-hub">
        <div class="ahorcado-wrapper">
            
            <div id="pantalla-dificultad" class="seccion-juego">
                <h2 id="txt-elige-dificultad" class="titulo-juego">Elige Dificultad</h2>
                <div class="botones-dificultad">
                    <button type="button" id="btn-dif-facil" class="btn-dificultad" data-nivel="facil">Fácil</button>
                    <button type="button" id="btn-dif-medio" class="btn-dificultad" data-nivel="medio">Medio</button>
                    <button type="button" id="btn-dif-dificil" class="btn-dificultad" data-nivel="dificil">Difícil</button>
                </div>
            </div>

            <div id="pantalla-juego" class="seccion-juego oculto">
                <div class="info-partida">
                    <div class="nivel-container">
                        <span id="label-nivel" class="badge-nivel">Nivel</span>
                        <button type="button" id="btn-cambiar-modo" class="btn-cambiar-modo">⚙</button>
                    </div>
                    <span id="intentos-restantes" class="intentos-text">Intentos: 6</span>
                </div>

                <div class="canvas-ahorcado">
                    <div id="dibujo-ahorcado"></div>
                </div>

                <div id="palabra-con-guiones" class="palabra-display"></div>

                <div id="teclado-letras" class="teclado-grid"></div>
                
                <div id="mensaje-resultado" class="mensaje-resultado"></div>

                <button type="button" id="btn-reiniciar" class="btn-default btn-block oculto">Siguiente Palabra</button>
            </div>

        </div>
    </main>

    <script type="module" src="Ahorcado.js"></script>
</body>
</html>

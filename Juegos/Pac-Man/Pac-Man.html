<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synkro - Pac-Man</title>
    <link rel="icon" type="image/jpeg" href="../../Synkro.jpg">
    <link rel="stylesheet" href="Pacman.css">
</head>
<body>

    <header class="hub-real-header">
        
        <div id="fila-perfil" class="header-real-row clickable-row" onclick="window.location.href=`../../Perfil.html`">
            <img id="user-avatar" src="../../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row" onclick="window.location.href=`../../NovaPoints.html`">
            <div class="meta-inline-item">
                <img src="../../NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label"></span>
                <span id="subs-display-value" class="subs-value"></span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default"></button>
            <button type="button" id="btn_volver" class="btn-default"></button>
        </div>

    </header>

    <main class="main-content-hub">
        <div class="pacman-wrapper">
            
            <div id="pantalla-inicio" class="seccion-juego">
                <h2 id="txt-titulo-pacman" class="titulo-juego"></h2>
                <div class="botones-inicio">
                    <button type="button" id="btn-comenzar" class="btn-comenzar"></button>
                </div>
            </div>

            <div id="pantalla-juego" class="seccion-juego oculto">
                <div class="info-partida">
                    <div class="nivel-container">
                        <span id="label-nivel" class="badge-nivel"></span>
                        <button type="button" id="btn-cambiar-modo" class="btn-cambiar-modo" title="Terminar y Salir">⚙</button>
                    </div>
                    <div class="marcador-container">
                        <img src="../../NovaPoints.png" class="novas-icon-small" alt="Novas">
                        <span id="contador-novas" class="intentos-text">0</span>
                    </div>
                </div>

                <div class="canvas-container">
                    <canvas id="pacmanCanvas" width="285" height="315"></canvas>
                </div>
                
                <div id="modal-intermedio" class="popup-intermedio oculto">
                    <div class="popup-contenido">
                        <h3 id="txt-pop-titulo"></h3>
                        <p id="txt-pop-sub"></p>
                        <button type="button" id="btn-pop-continuar" class="btn-comenzar"></button>
                    </div>
                </div>

                <div id="zona-GameOver" class="gameover-container oculto">
                    <div id="mensaje-resultado" class="mensaje-resultado"></div>
                    <div class="botones-gameover">
                        <button type="button" id="btn-reiniciar" class="btn-default"></button>
                        <button type="button" id="btn-terminar-go" class="btn-default"></button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="Pacman.js"></script>
</body>
</html>

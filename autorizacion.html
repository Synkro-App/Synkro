<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Autorización</title>
    <link rel="icon" type="image/jpeg" href="Synkro.jpg">
    <link rel="stylesheet" href="css/autorizacion.css">
</head>
<body>

    <div class="auth-card-container">
        <h1 id="title_cambiar_pass_auth" class="auth-main-title">Cambiar contraseña de autorización</h1>

        <form id="form-cambiar-auth" class="auth-form-layout">
            
            <div class="auth-field-group">
                <label id="label_nombre_completo" class="auth-input-label"></label>
                <input type="text" id="auth-fullname" class="auth-input-control" required autocomplete="name">
            </div>

            <div class="auth-field-group">
                <label id="label_usuario" class="auth-input-label">Usuario</label>
                <input type="text" id="auth-username" class="auth-input-control" required autocomplete="username">
            </div>

            <div class="auth-field-group">
                <label id="label_email" class="auth-input-label"></label>
                <input type="email" id="auth-email" class="auth-input-control" required autocomplete="email">
            </div>

            <div class="auth-field-group">
                <label id="label_contrasena" class="auth-input-label"></label>
                <input type="password" id="auth-password" class="auth-input-control" required autocomplete="current-password">
            </div>

            <div class="auth-buttons-row">
                <button type="button" id="btn_volver" class="btn-auth-default"></button>
                <button type="submit" id="btn_guardar_datos" class="btn-auth-default"></button>
            </div>

        </form>
    </div>

    <div id="custom-popup-overlay" class="popup-overlay select-hidden">
        <div class="popup-card-box">
            <p id="popup-message-text" class="popup-msg-content"></p>
            <div id="popup-input-container" class="popup-field-holder select-hidden">
                <input type="password" id="popup-secure-input" class="popup-dark-input">
            </div>
            <div class="popup-actions-row">
                <button type="button" id="popup-btn-cancel" class="btn-popup-action select-hidden"></button>
                <button type="button" id="popup-btn-confirm" class="btn-popup-action"></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/autorizacion.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritas - Synkro</title>
    <link rel="icon" type="image/jpeg" href="../Synkro.jpg">
    <link rel="stylesheet" href="css/Favoritas.css">
</head>
<body>

    <!-- Cabecera de Usuario -->
    <header class="hub-real-header">
        <div class="header-real-row clickable-row" id="fila-perfil">
            <img id="user-avatar" src="../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div class="header-real-row row-meta">
            <div class="meta-inline-item clickable-row" id="fila-novas">
                <img src="../NovaPoints.png" alt="Novas" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label">Suscripción:</span>
                <span id="subs-display-value" class="subs-value">-</span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button id="btn-logout" class="btn-default">Cerrar sesión</button>
            <button id="btn_volver" class="btn-default">Volver</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content-hub">
        <div class="catalogo-header-container">
            <h1 id="titulo-catalogo-favoritas" class="titulo-catalogo-text">Favoritas</h1>
        </div>

        <div id="contenedor-grid-favoritas" class="peliculas-grid">
            <!-- Las tarjetas de favoritos se inyectarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Script Principal -->
    <script type="module" src="js/Favoritas.js"></script>
</body>
</html>

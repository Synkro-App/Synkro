<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Temporadas</title>
    <link class="icon" type="image/jpeg" href="../Synkro.jpg">
    <link rel="stylesheet" href="css/Temporadas.css">
</head>
<body>

    <header class="hub-real-header">
        
        <div id="fila-perfil" class="header-real-row clickable-row">
            <img id="user-avatar" src="../default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text"></span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row">
            <div class="meta-inline-item">
                <img src="../NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label"></span>
                <span id="subs-display-value" class="subs-value"></span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default"></button>
            <button type="button" id="btn_volver" class="btn-default"></button>
        </div>

    </header>

    <main class="main-content-hub">
        <div class="temporada-header-container">
            <h1 id="titulo-temporada-full" class="titulo-temporada-text"></h1>
        </div>

        <!-- Seccion Reproductor Integrado (Mediante Iframe para enlaces directos) -->
        <div id="contenedor-reproductor-mpd" class="reproductor-box" style="display: none;">
            <div class="reproductor-header">
                <span id="titulo-reproduccion-actual" class="reproductor-titulo-txt"></span>
                <button type="button" id="btn-cerrar-reproductor" class="btn-cerrar-media">&times;</button>
            </div>
            <div class="video-wrapper modal-player-container">
                <iframe id="video-player-iframe" class="modal-player-iframe" allowfullscreen allow="autoplay"></iframe>
            </div>
        </div>

        <!-- Ficha Info de la Temporada -->
        <div id="contenedor-info-temporada" class="temporada-info-card" style="display: none;">
            <div class="temporada-poster-wrapper">
                <img id="img-temporada" src="" alt="Portada Temporada" class="img-temporada-poster">
            </div>
            <div class="temporada-detalles-wrapper">
                <div class="info-meta-row">
                    <span id="label-num-episodios" class="meta-label"></span>
                    <span id="val-num-episodios" class="meta-val"></span>
                </div>
                <div class="info-sinopsis-box">
                    <p id="sinopsis-temporada-txt" class="sinopsis-text"></p>
                </div>
            </div>
        </div>

        <!-- Lista de Episodios -->
        <div id="contenedor-lista-episodios" class="lista-episodios-container"></div>
    </main>

    <!-- Modal Pop-up Selección de Opciones de Reproducción -->
    <div id="modal-opciones-ver" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo-episodio" class="modal-titulo"></h3>
                <button type="button" id="btn-cerrar-modal" class="btn-cerrar-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-subtitulo-opciones" class="modal-subtitulo"></p>
                <div id="contenedor-botones-ver" class="modal-opciones-list"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/Temporadas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkro - Contacto</title>
    <link rel="icon" type="image/jpeg" href="Synkro.jpg">
    <link rel="stylesheet" href="css/ContactaconSynkro.css">
</head>
<body>

    <header class="hub-real-header">
        <div id="fila-perfil" class="header-real-row clickable-row">
            <img id="user-avatar" src="default-profile.png" alt="Avatar" class="avatar-img">
            <span id="user-display-name" class="username-text">Cargando...</span>
        </div>

        <div id="fila-novas" class="header-real-row row-meta clickable-row">
            <div class="meta-inline-item">
                <img src="NovaPoints.png" alt="NovaPoints" class="novas-icon">
                <span id="user-novas" class="novas-text">0</span>
            </div>
            <div class="meta-inline-item">
                <span id="text_subscripcion" class="subs-label"></span>
                <span id="subs-display-value" class="subs-value"></span>
            </div>
        </div>

        <div class="header-real-row row-actions">
            <button type="button" id="btn-logout" class="btn-default"></button>
            <button type="button" id="btn_volver" class="btn-default"></button>
        </div>
    </header>

    <main class="main-content-hub">
        <h1 id="text_titulo_contacto" class="contact-title">Contacta con Synkro</h1>
        
        <form id="form-contacto" class="contact-form">
            <div class="form-group">
                <label id="text_label_usuario" for="contact-user">Usuario:</label>
                <input type="text" id="contact-user" class="input-disabled" readonly>
            </div>

            <div class="form-group">
                <label id="text_label_tipo" for="contact-type">Tipo:</label>
                <select id="contact-type" class="select-contact">
                    <option value="peticion" id="option_peticion">Petición</option>
                    <option value="fallo" id="option_fallo">Fallo</option>
                    <option value="feedback" id="option_feedback">Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label id="text_label_mensaje" for="contact-message">Mensaje:</label>
                <textarea id="contact-message" rows="5" class="textarea-contact" required></textarea>
            </div>

            <button type="submit" id="btn_enviar_contacto" class="btn-default btn-submit-contact"></button>
        </form>
    </main>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal-box">
            <p id="custom-modal-text" class="custom-modal-message"></p>
            <div class="custom-modal-actions">
                <button type="button" id="custom-modal-btn-ok" class="btn-default">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/ContactaconSynkro.js"></script>
</body>
</html>
